# Reproducible benchmark: catalog-less ".duckdb catalog file + version-hint.text" vs Iceberg REST catalog
# under streaming (1 commit/s) and micro-batch (1 commit/10 s) writes with concurrent readers.
#   docker compose up --build --abort-on-container-exit runner
#   docker compose down -v
name: streaming-hint

x-s3: &s3
  AWS_ACCESS_KEY_ID: bench
  AWS_SECRET_ACCESS_KEY: bench-secret-key
  AWS_REGION: us-east-1

services:
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bench
      MINIO_ROOT_PASSWORD: bench-secret-key
      # No phone-home: call-home and update checks are off.
      MINIO_CALLHOME_ENABLE: "off"
      MINIO_UPDATE: "off"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  bucket:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 bench bench-secret-key && mc mb --ignore-existing local/warehouse
    environment:
      MC_DISABLE_PAGER: "1"

  rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      bucket:
        condition: service_completed_successfully
    environment:
      <<: *s3
      CATALOG_WAREHOUSE: s3://warehouse/rest/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    # The image has no curl/wget for a healthcheck; the runner waits for GET /v1/config itself.

  runner:
    build: ./runner
    depends_on:
      bucket:
        condition: service_completed_successfully
      rest:
        condition: service_started
    environment:
      <<: *s3
      S3_ENDPOINT: http://minio:9000
      REST_URI: http://rest:8181
      # Scenarios and their durations (seconds); see README.md.
      SCENARIOS: ${SCENARIOS:-stream:1:180,microbatch:10:600}
      VARIANTS: ${VARIANTS:-hint,rest}
      BATCH_ROWS: ${BATCH_ROWS:-1000}
      READERS: ${READERS:-4}
      READER_PAUSE_S: ${READER_PAUSE_S:-0.2}
    volumes:
      - ./results:/results
